services:
  # Your Rust chat application
  live_chat:
    build: .
    container_name: live_chat_app
    restart: unless-stopped
    # Just expose the port so other containers in the Docker network can see it.
    expose:
      - "3030" 

  # The Nginx reverse proxy
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80" # Expose HTTP port 80 to the public
    depends_on:
      - live_chat
